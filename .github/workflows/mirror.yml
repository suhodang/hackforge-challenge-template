# main과 태그를 suhodang 조직의 같은 이름 저장소로 덮어쓴다(읽기 전용 사본).
# template에서 만든 문제 저장소에도 이 파일이 복사되지만, 해답이 공개 사본으로 나가지 않도록 template 저장소에서만 돈다
name: mirror
on:
  push:
    branches: [main]
    tags: ['*']
concurrency: mirror
jobs:
  mirror:
    if: github.repository == 'pg-hackforge/hackforge-challenge-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false   # 기본 토큰이 붙으면 suhodang으로 push가 거부된다
      - env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
          REPO: ${{ github.event.repository.name }}
        run: |
          # private 저장소에 조직 Secret이 넘어오지 않으면 여기서 멈춘다(Free 플랜 제약 가능성)
          [ -n "$TOKEN" ] || { echo "::error::MIRROR_TOKEN이 비어 있음"; exit 1; }
          git push --force "https://x-access-token:${TOKEN}@github.com/suhodang/${REPO}.git" refs/remotes/origin/main:refs/heads/main --tags
