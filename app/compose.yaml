# 학습자 환경의 서비스. 서비스마다 healthcheck를 둔다(hackforge/ready.sh가 healthy를 기다림)
# 공개 이미지만 쓰는 서비스는 image에 tag를 고정하고 pull_policy: never를 둔다(실습 Pod는 외부 통신 없음)
services:
  web:
    build: web
    image: hackforge/challenge-example-web
    ports: ["127.0.0.1:8080:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 1s
      retries: 30
